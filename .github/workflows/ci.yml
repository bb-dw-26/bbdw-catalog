name: CI
on:
  push:
    branches: [main, 'demo/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verificar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Preparar Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatação
        run: test -z "$(gofmt -l .)"
      - name: Analisar código Go
        run: go vet ./...
      - name: Testar concorrência
        run: go test -race ./...
      - name: Compilar aplicação
        run: go build ./cmd/server
      - name: Validar imagem
        run: docker build -t bbdw-catalog:ci .
